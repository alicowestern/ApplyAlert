version: '3.8'
services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: applyalert
      POSTGRES_PASSWORD: password
      POSTGRES_DB: applyalert_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U applyalert -d applyalert_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
